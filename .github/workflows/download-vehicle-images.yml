name: Download official Hyundai vehicle photos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/download-vehicle-images.yml'
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image libraries
        run: python -m pip install requests beautifulsoup4 pillow
      - name: Extract photos from official model pages
        run: |
          cat > /tmp/download.py <<'PY'
          import io, os, pathlib, re, time, urllib.parse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          models = {
            'palisade':'palisade',
            'grandeur':'the-new-grandeur',
            'santafe':'santafe',
            'tucson':'tucson',
            'ioniq5':'ioniq5',
            'kona':'kona',
          }
          root=pathlib.Path('images');root.mkdir(exist_ok=True)
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (compatible; Chrome/123.0; vehicle image preview)'})
          for filename,slug in models.items():
            page=f'https://www.hyundai.com/kr/ko/e/vehicles/{slug}/intro'
            try:
              r=session.get(page,timeout=35);r.raise_for_status()
              soup=BeautifulSoup(r.text,'html.parser')
              urls=[]
              for key in ['og:image','twitter:image']:
                for m in soup.select('meta[property="'+key+'"],meta[name="'+key+'"]'):
                  if m.get('content'):urls.append(m['content'])
              for img in soup.select('img'):
                for attr in ['data-src','data-original','src']:
                  if img.get(attr):urls.append(img[attr])
              for m in re.findall(r'https?[^"\s<>]+?\.(?:jpg|jpeg|png|webp)(?:\?[^"\s<>]*)?',r.text,re.I):
                urls.append(m.replace('\\/','/'))
              urls=list(dict.fromkeys(urllib.parse.urljoin(page,u.replace('&amp;','&')) for u in urls if u and not u.startswith('data:')))
              urls.sort(key=lambda u:(0 if 'og' in u or slug in u.lower() else 1,0 if 'visual' in u.lower() or 'kv' in u.lower() else 1))
              done=False
              for url in urls[:100]:
                try:
                  res=session.get(url,timeout=25);res.raise_for_status()
                  if not res.headers.get('content-type','').startswith('image/'):continue
                  img=Image.open(io.BytesIO(res.content)).convert('RGB')
                  if img.width<650 or img.height<300:continue
                  img.thumbnail((1400,1000))
                  img.save(root/(filename+'.jpg'),quality=84,optimize=True)
                  print('SAVED',filename,url,img.size,flush=True);done=True;break
                except Exception:continue
              if not done:print('NOT FOUND',filename,page,'candidate count',len(urls),flush=True)
            except Exception as e:print('PAGE ERROR',filename,str(e),flush=True)
            time.sleep(1)
          PY
          python /tmp/download.py
      - name: Commit official images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          if ! git diff --cached --quiet; then
            git commit -m "Download model photos from official Hyundai pages"
            git push
          fi
