name: Download verified Hyundai model images
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/download-vehicle-images.yml'
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4 pillow
      - name: Fetch model-specific photos only
        run: |
          cat > /tmp/photos.py <<'PY'
          import io, pathlib, re, urllib.parse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          models={
            'palisade':('the-all-new-palisade',['palisade','팰리세이드']),
            'grandeur':('the-new-grandeur',['grandeur','그랜저']),
            'santafe':('the-all-new-santafe',['santafe','santa-fe','싼타페']),
            'tucson':('the-new-tucson',['tucson','투싼']),
            'ioniq5':('the-new-ioniq5',['ioniq5','ioniq-5','아이오닉']),
            'kona':('the-all-new-kona',['kona','코나'])
          }
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; Chrome/125.0; Safari/537.36)'})
          root=pathlib.Path('images');root.mkdir(exist_ok=True)
          for name,(slug,keywords) in models.items():
            url='https://www.hyundai.com/kr/ko/e/vehicles/'+slug+'/intro'
            try:
              page=s.get(url,timeout=35);page.raise_for_status()
              soup=BeautifulSoup(page.text,'html.parser')
              candidates=[]
              for img in soup.select('img, source'):
                src=img.get('data-src') or img.get('src') or img.get('data-original') or img.get('srcset','').split(',')[0].split(' ')[0]
                if not src:continue
                context=' '.join([src,img.get('alt',''),img.get('title',''),str(img.parent)[:350]]).lower()
                if not any(k.lower() in context for k in keywords):continue
                score=0
                if any(k.lower() in src.lower() for k in keywords):score+=5
                if any(k.lower() in img.get('alt','').lower() for k in keywords):score+=4
                if any(x in context for x in ['exterior','visual','kv','hero','front']):score+=2
                if any(x in context for x in ['chairman','founder','portrait','정주영','회장','history']):continue
                candidates.append((score,urllib.parse.urljoin(page.url,src)))
              for meta in soup.select('meta[property="og:image"],meta[name="twitter:image"]'):
                src=meta.get('content','')
                if any(k.lower() in src.lower() for k in keywords):
                  candidates.append((7,urllib.parse.urljoin(page.url,src)))
              candidates.sort(reverse=True)
              success=False
              for _,src in candidates:
                try:
                  response=s.get(src,timeout=25);response.raise_for_status()
                  im=Image.open(io.BytesIO(response.content))
                  if im.width<700 or im.height<350:continue
                  im=im.convert('RGB');im.thumbnail((1400,1000))
                  im.save(root/(name+'.jpg'),quality=85,optimize=True)
                  print('SAVED',name,src,im.size,flush=True)
                  success=True;break
                except Exception as ex:print('candidate failed',name,str(ex)[:100],flush=True)
              if not success:
                print('NO VERIFIED MODEL IMAGE:',name,'from',page.url,'candidates',len(candidates),flush=True)
            except Exception as ex:print('PAGE FAILED:',name,str(ex),flush=True)
          PY
          python /tmp/photos.py
      - name: Commit locally stored images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          if ! git diff --cached --quiet; then git commit -m "Store verified official model images"; git push; fi
