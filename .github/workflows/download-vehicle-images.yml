name: Capture official Hyundai model pages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/download-vehicle-images.yml'
      - 'scripts/download_images.py'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and image tools
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Capture first screen of each official model page
        run: |
          python scripts/download_images.py
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          if ! git diff --cached --quiet; then
            git commit -m "Use screenshots of official Hyundai model landing pages"
            git push
          fi
