name: Download vehicle photos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/download-vehicle-images.yml'
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Wikimedia Commons vehicle images
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, pathlib, time
          images={
            'palisade.jpg':'2025 Hyundai Palisade Calligraphy Hybrid Front.jpg',
            'grandeur.jpg':'2023 Hyundai Grandeur GN7.jpg',
            'santafe.jpg':'2024 Hyundai Santa Fe Luxury AWD in Hampton Grey, front left, 2024-06-30.jpg',
            'tucson.jpg':'2022 Hyundai Tucson Preferred, Front Right, 05-24-2021.jpg',
            'ioniq5.jpg':'2024 Hyundai IONIQ 5 Preferred Long Range AWD in Cyber Grey, front left, 2024-03-31.jpg',
            'kona.jpg':'2024 Hyundai Kona N Line AWD in Meta Blue, Front Right, 09-30-2023.jpg'
          }
          folder=pathlib.Path('images');folder.mkdir(exist_ok=True)
          headers={'User-Agent':'CarsalesPrototype/1.0 (Wikimedia Commons image downloader; GitHub Actions)'}
          for target,title in images.items():
            q=urllib.parse.urlencode({'action':'query','titles':'File:'+title,'prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':900,'format':'json'})
            try:
              with urllib.request.urlopen(urllib.request.Request('https://commons.wikimedia.org/w/api.php?'+q,headers=headers),timeout=25) as r: data=json.load(r)
              page=next(iter(data['query']['pages'].values()))
              if 'missing' in page: print('Not found:',title);continue
              info=page['imageinfo'][0]
              url=info.get('thumburl',info['url'])
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=35) as r: content=r.read()
              if len(content)<3000 or content[:3]!=b'\xff\xd8\xff':print('Not JPEG:',title);continue
              (folder/target).write_bytes(content);print('Saved',target,len(content))
            except Exception as exc:print('Failed:',title,repr(exc))
            time.sleep(1)
          PY
      - name: Update HTML to use downloaded local images
        run: |
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('index.html');s=p.read_text()
          for name,file in [('팰리세이드','palisade.jpg'),('그랜저','grandeur.jpg'),('싼타페','santafe.jpg'),('투싼','tucson.jpg'),('아이오닉 5','ioniq5.jpg'),('코나','kona.jpg')]:
            if not pathlib.Path('images',file).exists():continue
            marker='aria-label="'+name+' 공식 사진 확인"'
            i=s.find(marker)
            if i<0:continue
            start=s.find('>',i)+1;end=s.find('</a>',start)
            if end>start:s=s[:start]+'<img src="images/'+file+'" alt="'+name+' 차량 사진" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">'+s[end:]
          if pathlib.Path('images/palisade.jpg').exists():
            s=re.sub(r'\.hero\{background-image:[^}]*\}', '.hero{background-image:linear-gradient(90deg,#061d35eb,#061d3540),url("images/palisade.jpg");background-position:center;background-size:cover}',s)
          p.write_text(s)
          PY
      - name: Commit downloaded photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/
          if ! git diff --cached --quiet; then git commit -m "Store vehicle photos locally and reference image files"; git push; fi
